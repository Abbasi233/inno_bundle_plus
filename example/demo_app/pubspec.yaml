name: demo_app
description: "A demo app with flutter that is bundled into exe installer using inno_bundle_plus package."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
    
  inno_bundle_plus:
    path: ../..

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

inno_bundle_plus:
  id: 5ec949d0-0582-1e06-b073-b5d1161f6fff
  publisher: Furkan Abbasioğlu
  installer_icon: assets/images/installer.ico
  license_file: assets/LICENSE.txt
  languages:
    - English
    - Turkish
    - French
    - Arabic
  admin: auto
  arch: x64_compatible
  # Placeholders: {name}, {version}, {arch}, {publisher}.
  # Quoted on purpose: unquoted braces are YAML syntax and the file fails to parse.
  outputFilename: "{name}-{version}-Setup"

  files:
    - path: msvcp140.dll
      source: system32
      destination: lalaland
      name: msvcp140lalaland.dll
  
  dirs:
    # Additional project folders copied into the installer under {app}. Files and nested
    # subfolders are included.
    #
    # An entry is either a path string, or a map:
    #   source (required): folder to copy. A relative path is resolved from the
    #     project root. An absolute path (a drive letter, such as C:\...) is
    #     read from that exact location on disk, not from the project and not
    #     from under {app}.
    #   destination (optional): install path under {app}. When it is omitted,
    #     the source path is used. A plain string is that case: destination
    #     stays empty, so the folder keeps its source path inside {app}.
    # A source folder that is not on disk is skipped.
    #
    # Installed at {app}/assets/images:
    - assets/images
    # Same result, written as a map (destination defaults to source):
    - source: assets/images
    # Copied from assets/images, installed at {app}/data/images:
    - source: assets/images
      destination: data/images
    # Read from C:\shared\branding on disk, copied into {app}/branding:
    - source: C:\shared\branding
      destination: branding

  # executables (exes): run during setup (ssPostInstall), in list order, before
  # the app launch checkbox. .exe is Exec'd directly; .msi goes through msiexec /i.
  exes:
    # A: already under {app} (e.g. shipped via dirs/files as db\scripts\...)
    # Runs a post-install DB init script after MariaDB is on the machine.
    - path: db/scripts/init_schema.exe
      optional: false
      args: /silent
      status_msg: "Initializing database schema..."
      on_failure: continue

    # A + optional checkbox: offer a sample DB / demo data pack
    - path: db/scripts/load_sample_data.exe
      optional: true
      description: "Load MariaDB sample data"
      on_failure: ask

    # B: copy a DB helper from the project into {app}\db\tools\, then run it
    - source: db/tools/configure_service.exe
      optional: false
      args: /S
      status_msg: "Configuring MariaDB Windows service..."
      on_failure: abort

    # B + .msi: copied into the installer, launched via msiexec /i (+ args)
    - source: C:\shared\redist\mariadb\mariadb_X64.msi
      destination: db/redist
      optional: true
      description: "Install MariaDB Server"
      args: /qn
      status_msg: "Installing MariaDB Server..."
      on_failure: ask

  # vc_redist: download
  # sign_tool:
  #   command: $p
